name: Fix public catalogue

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(auto): fix public catalogue') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply safe catalogue fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/PublicBoutique.tsx')
          s = p.read_text()
          old = 'return product.main_image||product.images?.[0]||fallbackImages[index%fallbackImages.length]'
          new = 'return product.main_image||product.images?.[0]||""'
          if old in s:
              s = s.replace(old, new, 1)
          old_button = '>В корзину</Button>'
          new_button = '>Заказать букет</Button>'
          if old_button in s:
              s = s.replace(old_button, new_button, 1)
          p.write_text(s)
          PY
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo 'No changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/PublicBoutique.tsx
          git commit -m 'chore(auto): fix public catalogue'
          git push
