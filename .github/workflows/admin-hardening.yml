name: Admin hardening

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Patch admin auth timeout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text()
          old = 'const {data:isAdmin}=await supabase.rpc("is_admin");'
          new = 'const {data:isAdmin}=await Promise.race([supabase.rpc("is_admin"),new Promise<{data:boolean|null}>((resolve)=>setTimeout(()=>resolve({data:null}),10000))]);'
          if old not in s:
              print('No legacy admin RPC call found; nothing to patch.')
          else:
              s2 = s.replace(old, new)
              p.write_text(s2)
              print(f'Patched {s.count(old)} admin RPC call(s).')
          PY

      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx
          git commit -m "fix(admin): prevent access check from hanging"
          git push
