name: Fix admin auth

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !startsWith(github.event.head_commit.message, 'chore(auto): harden admin auth') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harden admin authentication and loading
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/App.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace('''const {data:sub}=supabase.auth.onAuthStateChange(async(_e,session)=>{if(session){const {data:isAdmin}=await Promise.race([supabase.rpc("is_admin"),new Promise<{data:boolean|null}>((resolve)=>setTimeout(()=>resolve({data:null}),10000))]);if(isAdmin){setReady(true);await load()}}else{setReady(false)}});''','''const {data:sub}=supabase.auth.onAuthStateChange((_e,session)=>{if(session){setTimeout(()=>{void (async()=>{const {data:isAdmin,error}=await Promise.race([supabase.rpc("is_admin"),new Promise<{data:boolean|null,error:Error|null}>((resolve)=>setTimeout(()=>resolve({data:null,error:new Error("Проверка доступа превысила время ожидания.")}),10000))]);if(!error&&isAdmin&&mounted){setReady(true);await load()}else if(mounted){setReady(false)}})()},0)}else{setReady(false)}});''')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit hardening
        run: |
          if git diff --quiet; then echo 'No changes needed.'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx
          git commit -m 'chore(auto): harden admin auth'
          git push
